<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Internal conduction and surface convection from a cylindrical solid</title>
  <desc id="desc">A cylindrical solid conducts heat from its interior to its surface over the characteristic length L c. Heat then leaves the surface by convection to surroundings at temperature T infinity.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2867a8"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b33b32"/>
    </marker>
    <style>
      .heading { font: 700 28px Arial, sans-serif; fill: #17233c; }
      .label { font: 22px Arial, sans-serif; fill: #17233c; }
      .small { font: 19px Arial, sans-serif; fill: #465469; }
      .math { font: italic 23px Georgia, serif; fill: #17233c; }
      .sub { font: italic 16px Georgia, serif; fill: #17233c; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="heading">Two successive heat-transfer steps</text>

  <!-- Cylindrical solid viewed in cross section. -->
  <circle cx="300" cy="265" r="170" fill="#dbeafe" stroke="#2867a8" stroke-width="5"/>
  <circle cx="300" cy="265" r="12" fill="#b33b32"/>
  <text x="300" y="245" text-anchor="middle" class="math">T<tspan baseline-shift="sub" class="sub">interior</tspan></text>
  <text x="300" y="300" text-anchor="middle" class="small">solid, conductivity <tspan class="math">k</tspan></text>

  <!-- Representative internal conduction distance. -->
  <line x1="325" y1="265" x2="452" y2="265" stroke="#2867a8" stroke-width="7" marker-end="url(#arrow-blue)"/>
  <line x1="325" y1="330" x2="465" y2="330" stroke="#465469" stroke-width="2"/>
  <line x1="325" y1="320" x2="325" y2="340" stroke="#465469" stroke-width="2"/>
  <line x1="465" y1="320" x2="465" y2="340" stroke="#465469" stroke-width="2"/>
  <text x="395" y="365" text-anchor="middle" class="math">L<tspan baseline-shift="sub" class="sub">c</tspan> = V/A<tspan baseline-shift="sub" class="sub">s</tspan></text>
  <text x="395" y="398" text-anchor="middle" class="small">representative conduction distance</text>

  <!-- Surface and convection. -->
  <circle cx="470" cy="265" r="9" fill="#17233c"/>
  <text x="470" y="225" text-anchor="middle" class="math">T<tspan baseline-shift="sub" class="sub">s</tspan></text>

  <line x1="490" y1="265" x2="825" y2="265" stroke="#b33b32" stroke-width="7" marker-end="url(#arrow-red)"/>
  <path d="M760 150 C820 130, 880 170, 940 150" fill="none" stroke="#9db7ce" stroke-width="4"/>
  <path d="M760 195 C825 175, 900 215, 980 190" fill="none" stroke="#9db7ce" stroke-width="4"/>
  <path d="M760 335 C825 315, 900 355, 980 330" fill="none" stroke="#9db7ce" stroke-width="4"/>
  <path d="M760 380 C820 360, 880 400, 940 380" fill="none" stroke="#9db7ce" stroke-width="4"/>
  <text x="900" y="245" text-anchor="middle" class="label">surroundings</text>
  <text x="900" y="285" text-anchor="middle" class="math">T<tspan baseline-shift="sub" class="sub">∞</tspan></text>
  <text x="650" y="225" text-anchor="middle" class="small">surface convection, coefficient <tspan class="math">h</tspan></text>

  <!-- Governing relations. -->
  <rect x="70" y="455" width="475" height="48" rx="6" fill="#eef5fc" stroke="#8ab3dc" stroke-width="2"/>
  <text x="308" y="487" text-anchor="middle" class="math">q<tspan baseline-shift="sub" class="sub">cond</tspan> ~ k(T<tspan baseline-shift="sub" class="sub">interior</tspan> - T<tspan baseline-shift="sub" class="sub">s</tspan>)/L<tspan baseline-shift="sub" class="sub">c</tspan></text>
  <rect x="575" y="455" width="555" height="48" rx="6" fill="#fff1ee" stroke="#d89289" stroke-width="2"/>
  <text x="852" y="487" text-anchor="middle" class="math">q<tspan baseline-shift="sub" class="sub">conv</tspan> = h(T<tspan baseline-shift="sub" class="sub">s</tspan> - T<tspan baseline-shift="sub" class="sub">∞</tspan>)</text>
</svg>
